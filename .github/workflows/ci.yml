name: CI

on:
  push:
  pull_request:

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Simulasi alur dan validasi paket kasus
        run: npm run test:sim
      - name: Build produksi
        run: npm run build
